apiVersion: v1
kind: Namespace
metadata:
  name: opensandbox-tenant-server
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: opensandbox-tenant-server
  namespace: opensandbox-tenant-server
  labels:
    app.kubernetes.io/name: opensandbox-tenant-server
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: opensandbox-tenant-server
  namespace: opensandbox-tenant-server
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # Three-node clusters cannot schedule maxSurge=1 with required
      # anti-affinity. PDB minAvailable=2 preserves two serving replicas while
      # one old pod is replaced.
      maxUnavailable: 1
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: opensandbox-tenant-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: opensandbox-tenant-server
    spec:
      serviceAccountName: opensandbox-tenant-server
      dnsPolicy: ClusterFirst
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - topologyKey: kubernetes.io/hostname
            labelSelector:
              matchLabels:
                app.kubernetes.io/name: opensandbox-tenant-server
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app.kubernetes.io/name: opensandbox-tenant-server
      containers:
      - name: tenant-server
        image: hwchiu/mon:tenant-server-latest
        imagePullPolicy: Always
        env:
        - name: OPENSANDBOX_SERVER_URL
          value: http://opensandbox-server.opensandbox-system.svc.cluster.local:8080
        - name: OPENSANDBOX_API_KEY
          valueFrom:
            secretKeyRef:
              name: opensandbox-tenant-server-secrets
              key: opensandbox-api-key
        - name: TENANT_SERVER_ADMIN_IDENTITIES
          value: local-cluster/opensandbox-tenant-server/opensandbox-tenant-server
        - name: TENANT_STORE
          value: postgres
        - name: TENANT_SERVER_STATE_STORE
          value: postgres
        - name: TENANT_SERVER_DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: opensandbox-tenant-server-secrets
              key: database-url
        - name: KFA_URL
          value: http://kube-federated-auth.kube-federated-auth.svc.cluster.local:8080
        - name: KFA_TOKEN_PATH
          value: /var/run/secrets/kubernetes.io/serviceaccount/token
        - name: KFA_TIMEOUT
          value: 10s
        - name: UPSTREAM_CREATE_TIMEOUT
          value: 180s
        - name: OPENSANDBOX_EGRESS_PORT
          value: "18080"
        - name: OPENSANDBOX_EGRESS_TOKEN
          valueFrom:
            secretKeyRef:
              name: opensandbox-egress-secret
              key: token
        - name: OPENSANDBOX_EGRESS_ALLOWED_FQDNS
          value: example.com,www.google.com,pypi.org,files.pythonhosted.org,github.com,api.github.com
        - name: OPENSANDBOX_EGRESS_BASELINE_FQDN
          value: opensandbox-server.opensandbox-system.svc.cluster.local
        - name: MAX_BODY_BYTES
          value: "52428800"
        - name: LISTEN_ADDR
          value: ":18080"
        ports:
        - name: http
          containerPort: 18080
        readinessProbe:
          httpGet: {path: /health, port: http}
          initialDelaySeconds: 20
          periodSeconds: 10
          failureThreshold: 12
        livenessProbe:
          httpGet: {path: /health, port: http}
          initialDelaySeconds: 60
          periodSeconds: 20
          failureThreshold: 6
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: opensandbox-tenant-server
  namespace: opensandbox-tenant-server
  labels:
    app.kubernetes.io/name: opensandbox-tenant-server
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: opensandbox-tenant-server
  ports:
  - name: http
    port: 8080
    targetPort: http
    nodePort: 30081
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: opensandbox-tenant-server
  namespace: opensandbox-tenant-server
  labels:
    release: monitoring
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: opensandbox-tenant-server
  endpoints:
  - port: http
    path: /metrics
    interval: 30s
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: opensandbox-tenant-server
  namespace: opensandbox-tenant-server
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: opensandbox-tenant-server
