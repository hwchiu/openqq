apiVersion: v1
kind: Namespace
metadata:
  name: opensandbox-tenant-server
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: opensandbox-tenant-server
  namespace: opensandbox-tenant-server
  labels:
    app.kubernetes.io/name: opensandbox-tenant-server
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: opensandbox-tenant-server
  namespace: opensandbox-tenant-server
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: opensandbox-tenant-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: opensandbox-tenant-server
    spec:
      serviceAccountName: opensandbox-tenant-server
      dnsPolicy: Default
      hostNetwork: true
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - topologyKey: kubernetes.io/hostname
            labelSelector:
              matchLabels:
                app.kubernetes.io/name: opensandbox-tenant-server
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app.kubernetes.io/name: opensandbox-tenant-server
      containers:
      - name: tenant-server
        image: hwchiu/mon:tenant-server-latest
        imagePullPolicy: Always
        env:
        - name: OPENSANDBOX_SERVER_URL
          value: http://10.107.229.160:8080
        - name: OPENSANDBOX_API_KEY
          valueFrom:
            secretKeyRef:
              name: opensandbox-tenant-server-secrets
              key: opensandbox-api-key
        - name: TENANT_SERVER_ADMIN_IDENTITIES
          value: local-cluster/opensandbox-tenant-server/opensandbox-tenant-server
        - name: TENANT_STORE
          value: postgres
        - name: TENANT_SERVER_STATE_STORE
          value: postgres
        - name: TENANT_SERVER_DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: opensandbox-tenant-server-secrets
              key: database-url
        - name: KFA_URL
          value: http://10.10.0.48:30082
        - name: KFA_TOKEN_PATH
          value: /var/run/secrets/kubernetes.io/serviceaccount/token
        - name: KFA_TIMEOUT
          value: 10s
        - name: MAX_BODY_BYTES
          value: "52428800"
        - name: LISTEN_ADDR
          value: ":18080"
        ports:
        - name: http
          containerPort: 18080
        readinessProbe:
          httpGet: {path: /health, port: http}
          initialDelaySeconds: 20
          periodSeconds: 10
          failureThreshold: 12
        livenessProbe:
          httpGet: {path: /health, port: http}
          initialDelaySeconds: 60
          periodSeconds: 20
          failureThreshold: 6
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: opensandbox-tenant-server
  namespace: opensandbox-tenant-server
  labels:
    app.kubernetes.io/name: opensandbox-tenant-server
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: opensandbox-tenant-server
  ports:
  - name: http
    port: 8080
    targetPort: http
    nodePort: 30081
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: opensandbox-tenant-server
  namespace: opensandbox-tenant-server
  labels:
    release: monitoring
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: opensandbox-tenant-server
  endpoints:
  - port: http
    path: /metrics
    interval: 30s
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: opensandbox-tenant-server
  namespace: opensandbox-tenant-server
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: opensandbox-tenant-server
