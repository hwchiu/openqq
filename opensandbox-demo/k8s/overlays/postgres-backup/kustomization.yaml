apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Template only. Render with --load-restrictor=LoadRestrictionsNone and replace
# the object-store destination before applying to a production cluster.
resources:
- ../../postgres-ha.yaml
- scheduled-backup.yaml

patches:
- target:
    group: postgresql.cnpg.io
    version: v1
    kind: Cluster
    name: opensandbox-postgres-ha
    namespace: opensandbox-tenant-server
  patch: |-
    - op: add
      path: /spec/backup
      value:
        retentionPolicy: 30d
        barmanObjectStore:
          destinationPath: s3://REPLACE_BUCKET/opensandbox-postgres
          endpointURL: https://REPLACE_OBJECT_STORE_ENDPOINT
          s3Credentials:
            accessKeyId:
              name: opensandbox-postgres-backup
              key: ACCESS_KEY_ID
            secretAccessKey:
              name: opensandbox-postgres-backup
              key: ACCESS_SECRET_KEY
