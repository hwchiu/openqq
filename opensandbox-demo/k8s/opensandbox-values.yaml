# Values for the official OpenSandbox all-in-one Helm chart.
#
# Install from a checkout of:
# https://github.com/opensandbox-group/OpenSandbox
#
# The chart owns the OpenSandbox Controller, CRDs, and Server. The Pool
# resource remains in opensandbox-pool.yaml because it is environment-specific.

opensandbox-controller:
  controller:
    replicaCount: 1
    logLevel: info
    metrics:
      enabled: false
    leaderElection:
      enabled: true
    snapshot:
      # v0.2.0 controller image no longer exposes this flag.
      containerdSocketPath: ""
  crds:
    install: true
    keep: true

opensandbox-server:
  fullnameOverride: opensandbox-server
  server:
    replicaCount: 1
    image:
      repository: opensandbox/server
      tag: v0.2.2
      pullPolicy: IfNotPresent
    env:
    - name: OPENSANDBOX_INSECURE_SERVER
      value: "YES"
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 1Gi
    volumeMounts:
    - name: data
      mountPath: /data
    volumes:
    - name: data
      persistentVolumeClaim:
        claimName: opensandbox-server-data
  configToml: |
    [server]
    host = "0.0.0.0"
    port = 80
    api_key = ""

    [log]
    level = "INFO"

    [runtime]
    type = "kubernetes"
    execd_image = "opensandbox/execd:v1.0.21"

    [kubernetes]
    kubeconfig_path = ""
    namespace = "opensandbox"
    informer_enabled = true
    informer_resync_seconds = 300
    informer_watch_timeout_seconds = 60
    snapshot_create_timeout_seconds = 900
    workload_provider = "batchsandbox"
    batchsandbox_template_file = "/etc/opensandbox/example.batchsandbox-template.yaml"

    [egress]
    image = "opensandbox/egress:v1.1.5"
    mode = "dns+nft"
