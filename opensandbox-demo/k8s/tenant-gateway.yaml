apiVersion: v1
kind: Namespace
metadata:
  name: opensandbox-gateway
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: opensandbox-tenant-gateway
  labels:
    app.kubernetes.io/name: opensandbox-tenant-gateway
  namespace: opensandbox-gateway
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: opensandbox-tenant-gateway-data
  namespace: opensandbox-gateway
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
  storageClassName: local-path
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: opensandbox-tenant-gateway
  namespace: opensandbox-gateway
data:
  app.py: |
    # populated by deployment upload
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: opensandbox-tenant-gateway
  namespace: opensandbox-gateway
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: opensandbox-tenant-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: opensandbox-tenant-gateway
    spec:
      serviceAccountName: opensandbox-tenant-gateway
      dnsPolicy: Default
      hostNetwork: true
      containers:
      - name: gateway
        image: python:3.12-slim
        workingDir: /app
        command: ["/bin/sh", "-c"]
        args: ["pip install --no-cache-dir -r /app/requirements.txt && exec uvicorn app:app --host 0.0.0.0 --port 8080"]
        env:
        - name: OPENSANDBOX_SERVER_URL
          value: http://10.107.229.160:8080
        - name: OPENSANDBOX_API_KEY
          valueFrom:
            secretKeyRef:
              name: opensandbox-tenant-gateway-secrets
              key: opensandbox-api-key
        - name: GATEWAY_ADMIN_TOKEN
          valueFrom:
            secretKeyRef:
              name: opensandbox-tenant-gateway-secrets
              key: admin-token
        - name: GATEWAY_DB_PATH
          value: /data/gateway.db
        - name: GATEWAY_STATE_DB_PATH
          value: /data/state.db
        - name: TENANT_STORE
          value: sqlite
        - name: MAX_BODY_BYTES
          value: "52428800"
        ports:
        - name: http
          containerPort: 8080
        volumeMounts:
        - name: source
          mountPath: /app/app.py
          subPath: app.py
        - name: source
          mountPath: /app/requirements.txt
          subPath: requirements.txt
        - name: data
          mountPath: /data
        readinessProbe:
          httpGet: {path: /health, port: http}
          initialDelaySeconds: 20
          periodSeconds: 10
          failureThreshold: 12
        livenessProbe:
          httpGet: {path: /health, port: http}
          initialDelaySeconds: 60
          periodSeconds: 20
          failureThreshold: 6
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
      volumes:
      - name: source
        configMap:
          name: opensandbox-tenant-gateway
      - name: data
        persistentVolumeClaim:
          claimName: opensandbox-tenant-gateway-data
---
apiVersion: v1
kind: Service
metadata:
  name: opensandbox-tenant-gateway
  namespace: opensandbox-gateway
  labels:
    app.kubernetes.io/name: opensandbox-tenant-gateway
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: opensandbox-tenant-gateway
  ports:
  - name: http
    port: 8080
    targetPort: http
    nodePort: 30081
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: opensandbox-tenant-gateway
  namespace: opensandbox-gateway
  labels:
    release: monitoring
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: opensandbox-tenant-gateway
  endpoints:
  - port: http
    path: /metrics
    interval: 30s
