name: Publish mon images

on:
  push:
    branches: [main]
    paths:
      - "opensandbox-demo/backend/**"
      - "opensandbox-demo/frontend/index.html"
      - "opensandbox-demo/tenant-server-go/**"
      - "opensandbox-demo/tests/**"
      - "opensandbox-demo/k8s/**"
      - ".github/workflows/publish-mon-images.yml"
  workflow_dispatch:

env:
  REGISTRY_REPOSITORY: hwchiu/mon

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go 1.25
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache-dependency-path: opensandbox-demo/tenant-server-go/go.sum

      - name: Verify pgx security floor
        working-directory: opensandbox-demo/tenant-server-go
        run: |
          test "$(go list -m -f '{{.Version}}' github.com/jackc/pgx/v5)" = "v5.9.0"

      - name: Run Tenant Server unit and race tests
        working-directory: opensandbox-demo/tenant-server-go
        run: go test -race -count=1 ./...

      - name: Run Tenant Server static analysis
        working-directory: opensandbox-demo/tenant-server-go
        run: go vet ./...

      - name: Validate Demo Server Python syntax
        run: python3 -m py_compile opensandbox-demo/backend/app.py

      - name: Run Demo Server unit tests
        run: |
          python3 -m pip install --disable-pip-version-check -r opensandbox-demo/backend/requirements.txt
          python3 -m unittest discover -s opensandbox-demo/backend -p 'test_*.py'

      - name: Validate repeatable test scripts
        run: |
          bash -n opensandbox-demo/tests/*.sh
          opensandbox-demo/tests/kfa-overlay-render-smoke.sh
          opensandbox-demo/tests/tenant-server-ingress-render-smoke.sh
          opensandbox-demo/tests/postgres-backup-render-smoke.sh
          opensandbox-demo/tests/tenant-server-alerts-render-smoke.sh

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY_REPOSITORY }}
          tags: |
            type=raw,value=tenant-server-${{ github.sha }}
            type=raw,value=demo-server-${{ github.sha }}
            type=raw,value=tenant-server-latest
            type=raw,value=demo-server-latest

      - name: Build and push Tenant Server (x86_64)
        uses: docker/build-push-action@v6
        with:
          context: opensandbox-demo
          file: opensandbox-demo/tenant-server-go/Dockerfile.registry
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.REGISTRY_REPOSITORY }}:tenant-server-${{ github.sha }}
            ${{ env.REGISTRY_REPOSITORY }}:tenant-server-latest
          labels: ${{ steps.meta.outputs.labels }}

      - name: Build and push Demo Server (x86_64)
        uses: docker/build-push-action@v6
        with:
          context: opensandbox-demo
          file: opensandbox-demo/backend/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.REGISTRY_REPOSITORY }}:demo-server-${{ github.sha }}
            ${{ env.REGISTRY_REPOSITORY }}:demo-server-latest
          labels: ${{ steps.meta.outputs.labels }}
